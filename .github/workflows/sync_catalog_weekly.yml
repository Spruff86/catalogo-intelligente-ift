name: Sincronizzazione Settimanale Catalogo IFT

on:
  schedule:
    # Esegue ogni Domenica alle 06:00 UTC (07:00 / 08:00 ora italiana)
    - cron: '0 6 * * 0'
  workflow_dispatch: # Permette anche di avviarlo manualmente con un clic da GitHub

jobs:
  sync-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa Dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt requests tqdm

      - name: Scarica Ultimo Excel e Re-indicizza Catalogo
        run: |
          python auto_sync_catalog.py

      - name: Commit e Push Aggiornamento Database su GitHub
        run: |
          git config --local user.email "bot@italianfoodtrading.com"
          git config --local user.name "IFT Catalog Bot"
          git add catalogo_horeca.db Dati\ per\ catalogo*.xlsx || true
          if git diff --staged --quiet; then
            echo "Nessun nuovo listino o modifica rilevata."
          else
            git commit -m "Auto-sync settimanale catalogo da Excel SAP [skip ci]"
            git push origin main
          fi
